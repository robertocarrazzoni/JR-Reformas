services:
  postgres:
    image: postgres:15-alpine
    container_name: jr_reformas_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jr_reformas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jr_reformas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
